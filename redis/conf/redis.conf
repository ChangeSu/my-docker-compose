# ------------- 基础配置 -------------
bind 0.0.0.0                  # 允许所有IP访问（Docker必备）
protected-mode no             # 关闭保护模式，否则外部无法连接
port 6379                     # 默认端口
timeout 0                     # 无超时
dir /data                     # 持久化文件存储目录（对应挂载的 ./data）

# ------------- 内存限制（核心！）-------------
# 容器总内存 128m，Redis 内部设 100m，留安全余量
maxmemory 100mb
# 内存满后自动淘汰最少使用的key，保证服务不崩溃
maxmemory-policy allkeys-lru

# ------------- 持久化配置（RDB+AOF 混合模式，数据不丢）-------------
dbfilename dump.rdb           # RDB快照文件名
appendonly yes                # 开启AOF日志
appendfilename appendonly.aof # AOF文件名
appendfsync everysec          # 每秒刷盘，平衡性能与安全
aof-use-rdb-preamble yes      # 开启混合持久化（Redis 4.0+最优）

# ------------- 安全配置（可选，建议开启）-------------
#requirepass 123456            # Redis密码，自行修改